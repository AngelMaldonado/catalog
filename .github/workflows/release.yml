name: Release

# Un tag vX.Y.Z (lo crea `just release tag`, con la versión que sale de los
# Conventional Commits) publica la imagen que corre en producción:
#
#   tag → qualify → imagen ghcr.io/angelmaldonado/catalog:vX.Y.Z · :<sha>
#       → release en GitHub con el manifiesto (imagen por digest)
#
# Corre en el runner propio (etiqueta `catalog`, reko-3, Docker por dind): sólo un tag
# lo dispara, y sólo quien tiene escritura en el repo empuja tags (ver qualify.yml).
# Sin el cache de Actions. No despliega: ningún secreto del servidor vive aquí. Después:
#   just release deploy vX.Y.Z
#   just release verify <sha>

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-catalog
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/angelmaldonado/catalog
  PB_VERSION: 0.40.6

jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      runner: '["self-hosted","catalog"]'

  publish:
    needs: qualify
    runs-on: [self-hosted, catalog]
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Identidad del release
        id: release
        run: |
          tag=$GITHUB_REF_NAME
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "No es un tag de release: $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      # el runner no trae el plugin buildx (sin él no hay TARGETARCH en el Dockerfile);
      # driver docker: construye en el dind del runner y reutiliza su cache de capas
      - uses: docker/setup-buildx-action@v3
        with:
          version: v0.38.1
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # la VPS es x86; una segunda plataforma duplica el build
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            PB_VERSION=${{ env.PB_VERSION }}
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_BUILD_HASH=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.release.outputs.published_at }}

      - name: Manifiesto
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "El build regresó un digest inválido: $DIGEST" >&2
            exit 1
          fi
          jq -n --arg image "${IMAGE}@${DIGEST}" --arg digest "$DIGEST" --arg gitTag "$TAG" \
            --arg sha "$GITHUB_SHA" --arg version "$VERSION" --arg publishedAt "$PUBLISHED_AT" \
            '{image: $image, digest: $digest, gitTag: $gitTag, sha: $sha, version: $version, publishedAt: $publishedAt}' \
            > release-image.json
          cat release-image.json

      # la API de releases con curl (no depende de que el runner traiga gh)
      - name: Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json')
          release=$(curl -fsS "${auth[@]}" "$api/releases/tags/$TAG" || true)
          if [ -z "$release" ]; then
            release=$(jq -n --arg tag "$TAG" \
              '{tag_name: $tag, name: $tag, generate_release_notes: true, make_latest: "true"}' |
              curl -fsS "${auth[@]}" -X POST "$api/releases" -d @-)
          fi
          id=$(jq -er '.id' <<< "$release")
          # un re-run reemplaza el manifiesto
          for asset in $(jq -r '.assets[]? | select(.name == "release-image.json") | .id' <<< "$release"); do
            curl -fsS "${auth[@]}" -X DELETE "$api/releases/assets/$asset"
          done
          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' --data-binary @release-image.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$id/assets?name=release-image.json" >/dev/null
          echo "release $TAG: $(jq -r '.html_url' <<< "$release")"

      - name: Resumen
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada: \`${TAG}\`"
            echo
            echo "- Imagen: \`${IMAGE}@${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo '**Desplegar y verificar:**'
            echo
            echo '```'
            echo "just release deploy ${TAG}"
            echo "just release verify ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
