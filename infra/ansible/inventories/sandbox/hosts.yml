---
# Disposable Ubuntu 24.04 container on reko-3 (`just sandbox up`), reached through
# reko-3 as a jump host. Never a real server.
all:
  children:
    servers:
      hosts:
        catalog-sandbox:
          ansible_host: 127.0.0.1
          ansible_port: 22223
          ansible_ssh_common_args: >-
            -o ProxyJump=reko-3
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=../.ansible/sandbox_known_hosts
    platform:
      children:
        servers: {}
