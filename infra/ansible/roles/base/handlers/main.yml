---
- name: Validate SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Validate SSH configuration

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: Restart SSH

- name: Restart Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: Restart Fail2ban
