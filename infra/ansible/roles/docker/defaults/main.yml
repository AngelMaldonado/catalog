---
docker_users:
  - "{{ deploy_user | default('angel') }}"
docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_apt_arch: "{{ docker_apt_arch_map.get(ansible_architecture, ansible_architecture) }}"
docker_apt_key_path: /etc/apt/keyrings/docker.asc
docker_legacy_apt_source_files:
  - /etc/apt/sources.list.d/docker.list
  - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
docker_legacy_apt_key_files:
  - /etc/apt/keyrings/docker.gpg

# Container log limits. json-file with a per-file cap and a rotation count, so
# one noisy container cannot fill the disk: the ceiling is size × count per
# container. Applied to containers created after convergence.
docker_log_max_size: 10m
docker_log_max_file: "3"

# This host runs only the catalog, so restarting Docker when daemon.json changes
# costs a few seconds of that one service. (In ~/dev/ayetec/infra, a shared
# Coolify host, this defaults to false.)
docker_restart_on_config_change: true
