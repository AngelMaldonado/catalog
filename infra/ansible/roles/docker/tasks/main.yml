---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker APT sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ docker_legacy_apt_source_files }}"

- name: Configure the Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ docker_apt_arch }}
      Signed-By: {{ docker_apt_key_path }}
    owner: root
    group: root
    mode: "0644"

- name: Remove unused legacy Docker signing keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ docker_legacy_apt_key_files }}"

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {{
        {
          "log-driver": "json-file",
          "log-opts": {
            "max-size": docker_log_max_size,
            "max-file": docker_log_max_file,
          },
        } | to_nice_json
      }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags: [logs]
  notify: "{{ 'Restart Docker' if docker_restart_on_config_change | bool else 'Report Docker restart needed' }}"

- name: Grant configured users access to Docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
