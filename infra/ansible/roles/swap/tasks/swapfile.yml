---
# One swap file, converged. Included once per entry in swap_files so a host can
# carry more than one: growing a live swap file means swapping it off first,
# which has to page its contents back into RAM the host may not have.
- name: Inspect the configured swap file
  ansible.builtin.stat:
    path: "{{ swap_item.path }}"
    get_checksum: false
  register: swap_file

- name: Validate an existing swap file
  ansible.builtin.assert:
    that:
      - swap_file.stat.isreg | default(false)
      - swap_file.stat.size == (swap_item.size_mb | int * 1024 * 1024)
    fail_msg: >-
      {{ swap_item.path }} already exists but is not a regular {{ swap_item.size_mb }} MiB file.
      Resize or remove it only after safely disabling swap.
  when: swap_file.stat.exists

- name: Inspect the existing swap signature
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - TYPE
      - "{{ swap_item.path }}"
  register: swap_signature
  check_mode: false
  changed_when: false
  failed_when: swap_signature.rc not in [0, 2]
  when: swap_file.stat.exists

- name: Refuse to overwrite an unexpected existing file
  ansible.builtin.assert:
    that: swap_signature.stdout == "swap"
    fail_msg: "{{ swap_item.path }} exists without a swap signature; refusing to overwrite it."
  when: swap_file.stat.exists

- name: Allocate the swap file
  ansible.builtin.command:
    argv:
      - fallocate
      - -l
      - "{{ swap_item.size_mb }}M"
      - "{{ swap_item.path }}"
    creates: "{{ swap_item.path }}"

- name: Secure the swap file
  ansible.builtin.file:
    path: "{{ swap_item.path }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  when: swap_file.stat.exists or not ansible_check_mode

- name: Format the new swap file
  ansible.builtin.command:
    argv:
      - mkswap
      - "{{ swap_item.path }}"
  when:
    - not swap_file.stat.exists
    - not ansible_check_mode
  changed_when: true

- name: Persist the swap file in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^\\s*{{ swap_item.path | regex_escape }}\\s+"
    line: "{{ swap_item.path }} none swap sw 0 0"
    state: present
    owner: root
    group: root
    mode: "0644"

- name: Inspect active swap devices
  ansible.builtin.command:
    argv:
      - swapon
      - --show=NAME
      - --noheadings
  register: swap_active_devices
  check_mode: false
  changed_when: false

- name: Activate the swap file
  ansible.builtin.command:
    argv:
      - swapon
      - "{{ swap_item.path }}"
  when:
    - not ansible_check_mode
    - swap_item.path not in swap_active_devices.stdout_lines
  changed_when: true
