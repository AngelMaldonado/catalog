<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Catálogo</title>
    <script>
      // Tema claro/oscuro antes de pintar, para que no parpadee (patrón de Comandas).
      // La preferencia es de este dispositivo ('sistema' | 'claro' | 'oscuro'); se elige en
      // Perfil, que llama a window.aplicarTema.
      ;(() => {
        const sistema = matchMedia('(prefers-color-scheme: dark)')
        const colores = { claro: '#ffffff', oscuro: '#0a0a0a' }
        let pref = 'sistema'
        try {
          pref = localStorage.getItem('tema') || 'sistema'
        } catch {}
        const aplicar = () => {
          const oscuro = pref === 'oscuro' || (pref === 'sistema' && sistema.matches)
          document.documentElement.classList.toggle('dark', oscuro)
          document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
            m.content = pref === 'sistema' ? colores[m.media.includes('dark') ? 'oscuro' : 'claro'] : colores[pref]
          })
        }
        window.aplicarTema = (p) => {
          pref = p
          try {
            localStorage.setItem('tema', p)
          } catch {}
          aplicar()
        }
        sistema.addEventListener('change', aplicar)
        aplicar()
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
